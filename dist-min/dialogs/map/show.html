<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="keywords" content="高德地图,高德地图API,地图标注"/>
    <meta name="description" content="高德地图标注展示"/>
    <title>高德地图</title>
    <style type="text/css">
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5f6f7;
        }

        #container {
            width: 100%;
            height: 100%;
        }

        .map-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #999;
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script type="text/javascript">
    (function () {
        function getParam(name) {
            var mat = new RegExp("[?#&]" + name + "=([^?#&]+)", "i").exec(location.href);
            if (!mat) {
                return "";
            }
            var val = mat[1];
            try {
                val = decodeURIComponent(val);
            } catch (e) {
            }
            return val;
        }

        function splitPos(str) {
            var arr = (str || "").split(","),
                lng = parseFloat(arr[0]),
                lat = parseFloat(arr[1]);
            if (isNaN(lng) || isNaN(lat)) {
                return [116.397428, 39.90923];
            }
            return [lng, lat];
        }

        var center = splitPos(getParam("center")),
            markerPos = splitPos(getParam("markers")),
            zoom = parseInt(getParam("zoom"), 10) || 11,
            width = parseInt(getParam("width"), 10),
            height = parseInt(getParam("height"), 10),
            key = getParam("key"),
            securityJsCode = getParam("skey"),
            map, marker, hostIframe, syncTimer;

        var container = document.getElementById("container");
        if (width) {
            container.style.width = width + "px";
        }
        if (height) {
            container.style.height = height + "px";
        }

        // 在编辑器内（内容区可编辑）时，允许拖动/缩放地图并把新坐标写回 iframe 地址
        function findHostIframe() {
            try {
                if (!parent || parent === window || !parent.document) {
                    return null;
                }
                if (parent.document.body && parent.document.body.contentEditable !== "true") {
                    return null;
                }
                var iframes = parent.document.getElementsByTagName("iframe");
                for (var i = 0; i < iframes.length; i++) {
                    if (iframes[i].contentWindow === window) {
                        return iframes[i];
                    }
                }
            } catch (e) {
            }
            return null;
        }

        function syncIframe() {
            if (!hostIframe) {
                return;
            }
            var src = hostIframe.getAttribute("src") || "",
                c = map.getCenter(),
                p = marker.getPosition(),
                newSrc = src
                    .replace(/([?#&])center=[^?#&]+/i, "$1center=" + c.getLng() + "," + c.getLat())
                    .replace(/([?#&])markers=[^?#&]+/i, "$1markers=" + p.getLng() + "," + p.getLat())
                    .replace(/([?#&])zoom=[^?#&]+/i, "$1zoom=" + map.getZoom());
            if (newSrc !== src) {
                hostIframe.setAttribute("src", newSrc);
            }
        }

        function deferSync() {
            clearTimeout(syncTimer);
            syncTimer = setTimeout(syncIframe, 200);
        }

        function render() {
            map = new AMap.Map("container", {
                zoom: zoom,
                center: center,
                resizeEnable: true,
                viewMode: "2D",
                dragEnable: !!hostIframe,
                zoomEnable: !!hostIframe,
                doubleClickZoom: !!hostIframe,
                scrollWheel: !!hostIframe
            });
            marker = new AMap.Marker({
                position: markerPos,
                draggable: !!hostIframe,
                cursor: hostIframe ? "move" : "default",
                anchor: "bottom-center"
            });
            map.add(marker);

            if (hostIframe) {
                marker.on("dragend", deferSync);
                map.on("moveend", deferSync);
                map.on("zoomend", deferSync);
            }
        }

        function showEmpty(tip) {
            container.innerHTML = '<div class="map-empty">' + tip + "</div>";
        }

        hostIframe = findHostIframe();

        if (!key) {
            showEmpty("地图缺少高德 Key，无法显示");
            return;
        }
        if (securityJsCode) {
            window._AMapSecurityConfig = { securityJsCode: securityJsCode };
        }
        var script = document.createElement("script");
        script.src = "https://webapi.amap.com/maps?v=2.0&key=" + encodeURIComponent(key);
        script.onload = function () {
            if (window.AMap) {
                render();
            } else {
                showEmpty("地图加载失败");
            }
        };
        script.onerror = function () {
            showEmpty("地图加载失败");
        };
        document.head.appendChild(script);
    })();
</script>
</body>
</html>
